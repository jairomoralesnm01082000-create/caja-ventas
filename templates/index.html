<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Caja - BERTHA | KARLA | CARLITA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .selected-border { border: 3px solid #22c55e !important; background-color: #ecfdf5 !important; color: #15803d !important; }
        .filter-active { background-color: #1e293b !important; color: #ffffff !important; }
    </style>
</head>
<body class="bg-slate-100 font-sans text-gray-800 pb-12">

    <!-- MODAL DE BLOQUEO POR PIN -->
    <div id="modal-pin" class="fixed inset-0 bg-slate-900 bg-opacity-95 z-50 flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-2xl shadow-2xl max-w-xs w-full text-center space-y-4">
            <div class="text-3xl">🔒</div>
            <h2 class="text-lg font-bold text-slate-800">Acceso Seguro</h2>
            <p class="text-xs text-gray-500">Ingresa el PIN de 4 dígitos para ingresar a la caja</p>
            <input type="password" id="input-pin" maxlength="4" placeholder="••••" class="w-full p-3 text-center text-2xl font-bold tracking-widest border border-gray-300 rounded-xl focus:border-green-600 focus:outline-none">
            <button onclick="validarPin()" class="w-full bg-green-600 text-white font-bold py-3 rounded-xl shadow hover:bg-green-700 active:scale-95 transition">Ingresar</button>
            <p id="error-pin" class="text-xs text-red-600 font-bold hidden">PIN incorrecto. Intenta de nuevo.</p>
        </div>
    </div>

    <!-- MODAL DE ABONO PARCIAL A FIADO -->
    <div id="modal-abono" class="fixed inset-0 bg-slate-900 bg-opacity-70 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white p-5 rounded-2xl shadow-2xl max-w-xs w-full space-y-3">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-sm text-slate-800">💵 Registrar Abono</h3>
                <button onclick="cerrarAbono()" class="text-gray-400 font-bold text-lg">&times;</button>
            </div>
            <p id="info-abono-fiado" class="text-xs text-gray-600"></p>
            <div>
                <label class="block text-xs font-bold mb-1">Monto a abonar (S/.):</label>
                <input type="number" step="0.10" id="monto-abono-input" placeholder="Ej: 5.00" class="w-full p-2 border rounded-lg text-base font-bold">
            </div>
            <div>
                <label class="block text-xs font-bold mb-1">Método de Cobro:</label>
                <select id="metodo-abono-input" class="w-full p-2 border rounded-lg text-xs font-bold">
                    <option value="Yape">📱 Yape</option>
                    <option value="Efectivo">💵 Efectivo</option>
                </select>
            </div>
            <button id="btn-confirmar-abono" onclick="confirmarAbono()" class="w-full bg-emerald-600 text-white font-bold py-2 rounded-xl text-xs hover:bg-emerald-700">Guardar Abono</button>
        </div>
    </div>

    <!-- MODAL DE EDICIÓN DE REGISTRO -->
    <div id="modal-editar" class="fixed inset-0 bg-slate-900 bg-opacity-70 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white p-5 rounded-2xl shadow-2xl max-w-sm w-full space-y-3">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-sm text-slate-800">✏️ Editar Transacción</h3>
                <button onclick="cerrarEditar()" class="text-gray-400 font-bold text-lg">&times;</button>
            </div>
            <input type="hidden" id="edit-id">
            <div>
                <label class="block text-xs font-bold mb-1">Dueña:</label>
                <select id="edit-dueno" class="w-full p-2 border rounded-lg text-xs font-bold">
                    <option value="BERTHA">BERTHA</option>
                    <option value="KARLA">KARLA</option>
                    <option value="CARLITA">CARLITA</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold mb-1">Monto (S/.):</label>
                <input type="number" step="0.10" id="edit-monto" class="w-full p-2 border rounded-lg text-sm font-bold">
            </div>
            <div>
                <label id="edit-label-detalle" class="block text-xs font-bold mb-1">Cliente / Motivo:</label>
                <input type="text" id="edit-detalle" class="w-full p-2 border rounded-lg text-xs">
            </div>
            <div id="edit-box-desc">
                <label class="block text-xs font-bold mb-1">Descripción / Producto:</label>
                <input type="text" id="edit-desc" class="w-full p-2 border rounded-lg text-xs">
            </div>
            <button id="btn-guardar-edicion" onclick="guardarEdicion()" class="w-full bg-blue-600 text-white font-bold py-2 rounded-xl text-xs hover:bg-blue-700">Guardar Cambios</button>
        </div>
    </div>

    <!-- MODAL DE DETALLE DE TRANSACCIÓN CON HISTORIAL DE ABONOS -->
    <div id="modal-detalle" class="fixed inset-0 bg-slate-900 bg-opacity-70 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white p-5 rounded-2xl shadow-2xl max-w-sm w-full space-y-3">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-base text-slate-800">📄 Detalle de Transacción</h3>
                <button onclick="cerrarDetalle()" class="text-gray-400 hover:text-gray-700 font-bold text-lg">&times;</button>
            </div>
            <div id="contenido-detalle" class="text-xs space-y-2 text-gray-700 max-h-72 overflow-y-auto"></div>
            <div id="acciones-detalle" class="pt-2 space-y-2"></div>
            <button onclick="cerrarDetalle()" class="w-full bg-slate-800 text-white font-bold py-2 rounded-xl text-xs hover:bg-slate-900">Cerrar</button>
        </div>
    </div>

    <!-- CONTENEDOR PRINCIPAL DE LA APP -->
    <div id="app-container" class="max-w-lg mx-auto bg-white min-h-screen shadow-lg p-4 hidden">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-lg font-bold text-slate-800">💼 Sistema de Caja</h1>
            <div class="flex space-x-2">
                <button onclick="forzarSincronizacion()" title="Actualizar datos ahora" class="text-xs bg-emerald-100 hover:bg-emerald-200 text-emerald-800 px-2.5 py-1 rounded-md font-bold transition flex items-center space-x-1">
                    <span>🔄</span> <span>Actualizar</span>
                </button>
                <button onclick="bloquearApp()" class="text-xs bg-gray-200 hover:bg-gray-300 px-2 py-1 rounded-md font-bold text-gray-700">🔒 Bloquear</button>
            </div>
        </div>
        
        <!-- Pestañas de Navegación -->
        <div class="flex border-b border-gray-200 text-xs sm:text-sm font-semibold mb-4 overflow-x-auto">
            <button onclick="cambiarTab('venta')" id="tab-venta" class="px-3 py-2 border-b-2 border-green-600 text-green-600 font-bold whitespace-nowrap">Venta / Fiado</button>
            <button onclick="cambiarTab('gasto')" id="tab-gasto" class="px-3 py-2 border-b-2 border-transparent text-gray-500 whitespace-nowrap">Gasto</button>
            <button onclick="cambiarTab('fiados')" id="tab-fiados" class="px-3 py-2 border-b-2 border-transparent text-gray-500 whitespace-nowrap">Cobrar Fiados</button>
            <button onclick="cambiarTab('reporte')" id="tab-reporte" class="px-3 py-2 border-b-2 border-transparent text-gray-500 whitespace-nowrap">Reporte</button>
            <button onclick="cambiarTab('historial')" id="tab-historial" class="px-3 py-2 border-b-2 border-transparent text-gray-500 whitespace-nowrap">Historial 🗑️</button>
        </div>

        <!-- 1. VENTA / FIADO -->
        <div id="sec-venta" class="space-y-4">
            <label class="block font-bold text-sm">Dueña:</label>
            <div class="grid grid-cols-3 gap-2">
                <button type="button" onclick="seleccionarDuenoV('BERTHA')" id="btn-v-BERTHA" class="p-2 border-2 rounded-lg font-bold text-sm text-center selected-border">👤 BERTHA</button>
                <button type="button" onclick="seleccionarDuenoV('KARLA')" id="btn-v-KARLA" class="p-2 border-2 rounded-lg font-bold text-sm text-center border-gray-300">👤 KARLA</button>
                <button type="button" onclick="seleccionarDuenoV('CARLITA')" id="btn-v-CARLITA" class="p-2 border-2 rounded-lg font-bold text-sm text-center border-gray-300">👤 CARLITA</button>
            </div>

            <div>
                <label class="block font-bold text-sm mb-1">Monto (S/.):</label>
                <input type="number" step="0.10" id="monto-v" placeholder="0.00" class="w-full p-2.5 border border-gray-300 rounded-lg text-xl font-bold">
                <!-- Botones de Montos Rápidos -->
                <div class="grid grid-cols-6 gap-1.5 mt-2 text-xs font-bold">
                    <button type="button" onclick="sumarMontoRapido('v', 1)" class="p-1.5 bg-slate-100 hover:bg-slate-200 border rounded">+1</button>
                    <button type="button" onclick="sumarMontoRapido('v', 2)" class="p-1.5 bg-slate-100 hover:bg-slate-200 border rounded">+2</button>
                    <button type="button" onclick="sumarMontoRapido('v', 5)" class="p-1.5 bg-slate-100 hover:bg-slate-200 border rounded">+5</button>
                    <button type="button" onclick="sumarMontoRapido('v', 10)" class="p-1.5 bg-slate-100 hover:bg-slate-200 border rounded">+10</button>
                    <button type="button" onclick="sumarMontoRapido('v', 20)" class="p-1.5 bg-slate-100 hover:bg-slate-200 border rounded">+20</button>
                    <button type="button" onclick="limpiarMontoRapido('v')" class="p-1.5 bg-red-100 hover:bg-red-200 text-red-700 border rounded">C</button>
                </div>
            </div>

            <label class="block font-bold text-sm">Forma de Pago:</label>
            <div class="grid grid-cols-2 gap-3">
                <button type="button" onclick="seleccionarMetodo('Yape')" id="btn-metodo-yape" class="p-3 border-2 rounded-lg font-bold flex items-center justify-center space-x-2 selected-border">
                    <span class="w-6 h-6 bg-purple-700 rounded-full flex items-center justify-center text-white text-xs font-bold">Y</span>
                    <span>Yape</span>
                </button>
                <button type="button" onclick="seleccionarMetodo('Fiado')" id="btn-metodo-fiado" class="p-3 border-2 rounded-lg font-bold flex items-center justify-center space-x-2 border-gray-300">
                    <span>📝 Fiado</span>
                </button>
            </div>

            <div id="campos-yape" class="space-y-3">
                <div>
                    <label class="block font-bold text-sm mb-1">Descripción / Producto (Opcional):</label>
                    <input type="text" id="desc-yape" placeholder="Ej: Gaseosa 1.5L, Pan, etc." class="w-full p-2 border border-gray-300 rounded-lg text-sm">
                </div>
            </div>

            <div id="campos-fiado" class="space-y-3 hidden">
                <div>
                    <label class="block font-bold text-sm mb-1">Nombre del Cliente:</label>
                    <input type="text" id="cliente-fiado" placeholder="Ej: Doña Carmen, Juan Pérez" class="w-full p-2 border border-gray-300 rounded-lg text-sm">
                </div>
                <div>
                    <label class="block font-bold text-sm mb-1">Descripción del Fiado:</label>
                    <input type="text" id="desc-fiado" placeholder="¿Qué producto llevó?" class="w-full p-2 border border-gray-300 rounded-lg text-sm">
                </div>
            </div>

            <div>
                <label class="block font-bold text-sm mb-1">Fecha:</label>
                <input type="date" id="fecha-v" class="w-full p-2 border border-gray-300 rounded-lg">
            </div>

            <button id="btn-guardar-venta" onclick="guardarVenta()" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg shadow hover:bg-green-700 active:scale-95 transition">💾 Guardar Venta / Fiado</button>
        </div>

        <!-- 2. GASTO -->
        <div id="sec-gasto" class="space-y-4 hidden">
            <label class="block font-bold text-sm">Dueña a descontar:</label>
            <div class="grid grid-cols-3 gap-2">
                <button type="button" onclick="seleccionarDuenoG('BERTHA')" id="btn-g-BERTHA" class="p-2 border-2 rounded-lg font-bold text-sm text-center selected-border">👤 BERTHA</button>
                <button type="button" onclick="seleccionarDuenoG('KARLA')" id="btn-g-KARLA" class="p-2 border-2 rounded-lg font-bold text-sm text-center border-gray-300">👤 KARLA</button>
                <button type="button" onclick="seleccionarDuenoG('CARLITA')" id="btn-g-CARLITA" class="p-2 border-2 rounded-lg font-bold text-sm text-center border-gray-300">👤 CARLITA</button>
            </div>

            <div>
                <label class="block font-bold text-sm mb-1">Motivo del Gasto:</label>
                <input type="text" id="motivo-g" placeholder="Ej: Bolsas, pasajes, compras" class="w-full p-2 border border-gray-300 rounded-lg text-sm">
            </div>

            <div>
                <label class="block font-bold text-sm mb-1">Monto Gastado (S/.):</label>
                <input type="number" step="0.10" id="monto-g" placeholder="0.00" class="w-full p-2.5 border border-gray-300 rounded-lg text-xl font-bold">
                <!-- Botones de Montos Rápidos -->
                <div class="grid grid-cols-6 gap-1.5 mt-2 text-xs font-bold">
                    <button type="button" onclick="sumarMontoRapido('g', 1)" class="p-1.5 bg-slate-100 hover:bg-slate-200 border rounded">+1</button>
                    <button type="button" onclick="sumarMontoRapido('g', 2)" class="p-1.5 bg-slate-100 hover:bg-slate-200 border rounded">+2</button>
                    <button type="button" onclick="sumarMontoRapido('g', 5)" class="p-1.5 bg-slate-100 hover:bg-slate-200 border rounded">+5</button>
                    <button type="button" onclick="sumarMontoRapido('g', 10)" class="p-1.5 bg-slate-100 hover:bg-slate-200 border rounded">+10</button>
                    <button type="button" onclick="sumarMontoRapido('g', 20)" class="p-1.5 bg-slate-100 hover:bg-slate-200 border rounded">+20</button>
                    <button type="button" onclick="limpiarMontoRapido('g')" class="p-1.5 bg-red-100 hover:bg-red-200 text-red-700 border rounded">C</button>
                </div>
            </div>

            <div>
                <label class="block font-bold text-sm mb-1">Fecha:</label>
                <input type="date" id="fecha-g" class="w-full p-2 border border-gray-300 rounded-lg">
            </div>

            <button id="btn-guardar-gasto" onclick="guardarGasto()" class="w-full bg-orange-600 text-white font-bold py-3 rounded-lg shadow hover:bg-orange-700 active:scale-95 transition">💸 Guardar Gasto</button>
        </div>

        <!-- 3. COBRAR FIADOS -->
        <div id="sec-fiados" class="space-y-4 hidden">
            <div>
                <label class="block font-bold text-xs text-gray-600 mb-1">🔍 Buscar fiador por cliente:</label>
                <input type="text" id="buscar-fiador" oninput="filtrarFiados()" placeholder="Escribe el nombre del cliente..." class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:border-green-600 focus:outline-none">
            </div>

            <div id="box-total-deuda" class="bg-amber-50 border border-amber-200 rounded-lg p-3 flex justify-between items-center">
                <span class="text-xs font-bold text-amber-800">Deuda total pendiente:</span>
                <span id="total-deuda-texto" class="text-base font-bold text-amber-900">S/. 0.00</span>
            </div>

            <h2 class="font-bold text-sm text-gray-700">Fiados Pendientes:</h2>
            <div id="lista-fiados" class="space-y-2"></div>
        </div>

        <!-- 4. REPORTE, EXPORTACIÓN Y BACKUP -->
        <div id="sec-reporte" class="space-y-4 hidden">
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs font-bold mb-1">Desde:</label>
                    <input type="date" id="rep-desde" class="w-full p-2 border border-gray-300 rounded">
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1">Hasta:</label>
                    <input type="date" id="rep-hasta" class="w-full p-2 border border-gray-300 rounded">
                </div>
            </div>
            
            <div class="grid grid-cols-3 gap-1.5">
                <button onclick="calcularGanancias()" class="bg-blue-600 text-white font-bold py-2 rounded-lg shadow hover:bg-blue-700 text-xs">🔍 Calcular</button>
                <button onclick="descargarExcel()" class="bg-emerald-700 text-white font-bold py-2 rounded-lg shadow hover:bg-emerald-800 text-xs">📥 Excel</button>
                <button onclick="copiarWhatsApp()" class="bg-teal-600 text-white font-bold py-2 rounded-lg shadow hover:bg-teal-700 text-xs">📲 WhatsApp</button>
            </div>

            <div id="resultado-reporte" class="bg-gray-50 p-4 rounded-lg border border-gray-200 font-mono text-sm space-y-3"></div>

            <button onclick="descargarBackup()" class="w-full bg-slate-700 text-white font-bold py-2.5 rounded-lg text-xs hover:bg-slate-800 flex items-center justify-center space-x-1">
                <span>💾 Descargar Copia de Seguridad Completa (JSON)</span>
            </button>
        </div>

        <!-- 5. HISTORIAL CON FILTROS POR DUEÑA -->
        <div id="sec-historial" class="space-y-3 hidden">
            <div class="flex justify-between items-center">
                <h2 id="titulo-historial" class="font-bold text-sm text-gray-700">Historial completo:</h2>
                <button id="btn-toggle-papelera" onclick="togglePapelera()" class="text-xs bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold px-2.5 py-1.5 rounded-lg transition">
                    🗑️ Ver Papelera
                </button>
            </div>

            <!-- Filtros por dueña -->
            <div class="grid grid-cols-4 gap-1.5 text-xs font-bold">
                <button onclick="filtrarDuenoHistorial('TODAS')" id="filtro-h-TODAS" class="p-1.5 rounded border border-gray-300 filter-active">TODAS</button>
                <button onclick="filtrarDuenoHistorial('BERTHA')" id="filtro-h-BERTHA" class="p-1.5 rounded border border-gray-300 bg-white">BERTHA</button>
                <button onclick="filtrarDuenoHistorial('KARLA')" id="filtro-h-KARLA" class="p-1.5 rounded border border-gray-300 bg-white">KARLA</button>
                <button onclick="filtrarDuenoHistorial('CARLITA')" id="filtro-h-CARLITA" class="p-1.5 rounded border border-gray-300 bg-white">CARLITA</button>
            </div>

            <div id="lista-historial" class="space-y-2"></div>
        </div>
    </div>

    <script>
        let duenoV = 'BERTHA';
        let duenoG = 'BERTHA';
        let metodoV = 'Yape';
        let fiadosGlobales = [];
        let datosCompletosGlobales = [];
        let viendoPapelera = false;
        let tabActual = 'venta';
        let filtroDuenoActual = 'TODAS';
        let fiadoAbonoSeleccionado = null;
        let textoWhatsAppGlobal = '';

        function vibrarConfirmacion() {
            if (navigator.vibrate) navigator.vibrate(50);
        }

        function setFechaHoy() {
            const fechaLocal = new Date();
            const año = fechaLocal.getFullYear();
            const mes = String(fechaLocal.getMonth() + 1).padStart(2, '0');
            const dia = String(fechaLocal.getDate()).padStart(2, '0');
            const hoy = `${año}-${mes}-${dia}`;
            
            document.getElementById('fecha-v').value = hoy;
            document.getElementById('fecha-g').value = hoy;
            document.getElementById('rep-desde').value = hoy;
            document.getElementById('rep-hasta').value = hoy;
        }
        setFechaHoy();

        // Botones de monto rápido (+1, +2, +5, etc.)
        function sumarMontoRapido(tipo, valor) {
            const input = document.getElementById(`monto-${tipo}`);
            let actual = parseFloat(input.value) || 0;
            input.value = (actual + valor).toFixed(2);
        }

        function limpiarMontoRapido(tipo) {
            document.getElementById(`monto-${tipo}` biographical).value = '';
        }

        async function fetchSinCache(url, opciones = {}) {
            const separador = url.includes('?') ? '&' : '?';
            const urlConTimestamp = `${url}${separador}_t=${Date.now()}`;
            return await fetch(urlConTimestamp, {
                ...opciones,
                cache: 'no-store',
                headers: {
                    ...opciones.headers,
                    'Cache-Control': 'no-cache, no-store, must-revalidate',
                    'Pragma': 'no-cache',
                    'Expires': '0'
                }
            });
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') forzarSincronizacion();
        });
        window.addEventListener('focus', () => forzarSincronizacion());

        // Polling rápido cada 1.5s para actualización en vivo entre móviles y laptop
        setInterval(() => {
            if (tabActual === 'historial') cargarHistorialSilencioso();
            if (tabActual === 'fiados') cargarFiadosSilencioso();
        }, 1500);

        function forzarSincronizacion() {
            if (tabActual === 'fiados') cargarFiados();
            if (tabActual === 'historial') cargarHistorial();
            if (tabActual === 'reporte') calcularGanancias();
        }

        async function validarPin() {
            const pin = document.getElementById('input-pin').value;
            const res = await fetchSinCache('/api/verificar_pin', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ pin })
            });
            const data = await res.json();
            if (data.valido) {
                document.getElementById('modal-pin').classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden');
                document.getElementById('error-pin').classList.add('hidden');
            } else {
                document.getElementById('error-pin').classList.remove('hidden');
                document.getElementById('input-pin').value = '';
            }
        }

        function bloquearApp() {
            document.getElementById('modal-pin').classList.remove('hidden');
            document.getElementById('app-container').classList.add('hidden');
            document.getElementById('input-pin').value = '';
        }

        function cambiarTab(tab) {
            tabActual = tab;
            ['venta', 'gasto', 'fiados', 'reporte', 'historial'].forEach(t => {
                document.getElementById(`sec-${t}`).classList.add('hidden');
                document.getElementById(`tab-${t}`).className = 'px-3 py-2 border-b-2 border-transparent text-gray-500 whitespace-nowrap';
            });
            document.getElementById(`sec-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`).className = 'px-3 py-2 border-b-2 border-green-600 text-green-600 font-bold whitespace-nowrap';

            if(tab === 'fiados') cargarFiados();
            if(tab === 'historial') {
                viendoPapelera = false;
                actualizarBotonPapelera();
                cargarHistorial();
            }
            if(tab === 'reporte') calcularGanancias();
        }

        function seleccionarDuenoV(d) {
            duenoV = d;
            ['BERTHA', 'KARLA', 'CARLITA'].forEach(nom => {
                const btn = document.getElementById(`btn-v-${nom}`);
                btn.className = (nom === d) ? 'p-2 border-2 rounded-lg font-bold text-sm text-center selected-border' : 'p-2 border-2 rounded-lg font-bold text-sm text-center border-gray-300';
            });
            setFechaHoy();
        }

        function seleccionarDuenoG(d) {
            duenoG = d;
            ['BERTHA', 'KARLA', 'CARLITA'].forEach(nom => {
                const btn = document.getElementById(`btn-g-${nom}`);

        function filtrarFiados() {
            const busqueda = document.getElementById('buscar-fiador').value.toLowerCase();
            const cont = document.getElementById('lista-fiados');
            cont.innerHTML = '';

            const filtrados = fiadosGlobales.filter(f => (f.cliente || '').toLowerCase().includes(busqueda));
            const totalDeuda = filtrados.reduce((acc, curr) => acc + curr.monto, 0);
            document.getElementById('total-deuda-texto').innerText = `S/. ${totalDeuda.toFixed(2)}`;

            if(filtrados.length === 0) {
                cont.innerHTML = '<p class="text-gray-500 text-sm text-center py-4">No se encontraron fiados pendientes.</p>';
                return;
            }

            filtrados.forEach(f => {
                cont.innerHTML += `

                    <div>

                        <div class="text-xs font-semibold text-indigo-700">Cliente: ${f.cliente || 'Sin nombre'}</div>

        function renderizarHistorial() {
            const cont = document.getElementById('lista-historial');

                listaFiltrada = listaFiltrada.filter(d => d.dueno === filtroDuenoActual);

            if (listaFiltrada.length === 0) {
                cont.innerHTML = viendoPapelera 
                    ? '<p class="text-gray-400 text-xs text-center py-6">La papelera está vacía.</p>'
                    : '<p class="text-gray-400 text-xs text-center py-6">No hay registros con este filtro.</p>';
                return;
            }

            listaFiltrada.slice().reverse().forEach(d => {
                let badge = '';
                let bgCard = 'bg-white';
                let info = '';
                let esFiadoCobrado = false;

                if (d.tipo === 'Ingreso') {
                    if (d.metodo === 'Yape') {
                        badge = '<span class="text-purple-700 font-bold">[Yape]</span>';
                    } else if (d.metodo === 'Fiado') {
                        if (d.cobrado) {
                            esFiadoCobrado = true;
                            const cobroEn = d.metodo_cobro || 'Yape';
                            badge = `<span class="text-emerald-700 font-bold">[Fiado Cobrado (${cobroEn}) ✅]</span>`;
                            bgCard = 'bg-emerald-50 border-emerald-300';
                        } else {
                            badge = '<span class="text-amber-700 font-bold">[Fiado Pendiente ⏳]</span>';
                            bgCard = 'bg-amber-50 border-amber-200';
                        }
                    }
                    info = `[${d.fecha.slice(0, 10)}] 👤 ${d.dueno} | ${badge} S/. ${d.monto.toFixed(2)}`;
                } else {
                    badge = '<span class="text-orange-700 font-bold">[Gasto 💸]</span>';
                    info = `[${d.fecha.slice(0, 10)}] 👤 ${d.dueno} | ${badge} S/. ${d.monto.toFixed(2)}`;
                }

                if (viendoPapelera) bgCard = 'bg-red-50 border-red-200';

                cont.innerHTML += `
                <div class="border p-2.5 rounded-lg flex justify-between items-center ${bgCard} text-xs shadow-sm cursor-pointer hover:shadow-md transition">
                    <div class="flex-1 pr-2" onclick="verDetalle(${d.id})">

                        ${d.cliente ? `<div class="text-gray-500 font-semibold">Cliente: ${d.cliente}</div>` : ''}

                        ${d.motivo ? `<div class="text-gray-500 italic">Motivo: ${d.motivo}</div>` : ''}
                    </div>
                    <div class="flex items-center space-x-1">
                        ${viendoPapelera 
                            ? `<button onclick="restaurar(${d.id})" title="Restaurar a activo" class="bg-emerald-600 text-white font-bold px-2 py-1 rounded hover:bg-emerald-700">↩️ Restaurar</button>`
                            : `
                                ${esFiadoCobrado ? `<button onclick="deshacerCobro(${d.id})" title="Volver a poner pendiente" class="bg-amber-500 text-white font-bold px-2 py-1 rounded hover:bg-amber-600">↩️ Reabrir</button>` : ''}

        async function calcularGanancias() {
            const desde = document.getElementById('rep-desde').value;
            const hasta = document.getElementById('rep-hasta').value;
            const res = await fetchSinCache('/api/datos');
            const datos = await res.json();

            const balance = {
                'BERTHA': { yape: 0, efectivo: 0, fiado_p: 0, gastos: 0 },
                'KARLA': { yape: 0, efectivo: 0, fiado_p: 0, gastos: 0 },
                'CARLITA': { yape: 0, efectivo: 0, fiado_p: 0, gastos: 0 }
            };

            datos.forEach(d => {
                if (d.eliminado) return;
                const f = d.fecha.slice(0, 10);
                if(f >= desde && f <= hasta) {
                    if(d.tipo === 'Ingreso') {
                        if(d.metodo === 'Yape') {
                            balance[d.dueno].yape += d.monto;
                        } else if(d.metodo === 'Fiado') {
                            if(d.cobrado) {
                                if(d.metodo_cobro === 'Efectivo') {
                                    balance[d.dueno].efectivo += d.monto;
                                } else {
                                    balance[d.dueno].yape += d.monto;
                                }
                            } else {
                                balance[d.dueno].fiado_p += d.monto;
                            }
                        }
                    } else if(d.tipo === 'Gasto') {
                        balance[d.dueno].gastos += d.monto;
                    }
                }
            });

            let html = `<div class="font-bold border-b pb-2 text-slate-800">📊 BALANCE DEL ${desde} AL ${hasta}</div>`;
            let netosGlobales = {};
            let netosYape = {};

            let wa = `📊 *RESUMEN DE CAJA (${desde} al ${hasta})*\n\n`;

            ['BERTHA', 'KARLA', 'CARLITA'].forEach(nom => {
                const b = balance[nom];
                const totalIngresos = b.yape + b.efectivo;
                const netoTotal = totalIngresos - b.gastos;
                const netoYapeSolo = b.yape - b.gastos;

                netosGlobales[nom] = netoTotal;
                netosYape[nom] = netoYapeSolo;

                const colorTotal = netoTotal >= 0 ? 'text-green-600' : 'text-red-600';
                const signTotal = netoTotal >= 0 ? '+' : '';

                const colorYape = netoYapeSolo >= 0 ? 'text-purple-700' : 'text-red-600';
                const signYape = netoYapeSolo >= 0 ? '+' : '';

                html += `
                <div class="border-b pb-3 pt-2">
                    <div class="font-bold text-slate-800 text-sm">👤 ${nom}:</div>
                    <div class="text-xs">📱 Total en Yape: S/. ${b.yape.toFixed(2)}</div>
                    <div class="text-xs">💵 Total en Efectivo: S/. ${b.efectivo.toFixed(2)}</div>
                    <div class="text-xs text-orange-700">💸 Gastos realizados: S/. ${b.gastos.toFixed(2)}</div>
                    
                    <div class="bg-purple-50 border border-purple-200 rounded p-1.5 my-1.5 text-xs">
                        <div class="font-bold ${colorYape}">📱 SALDO NETO EN YAPE (Yape - Gastos): S/. ${signYape}${netoYapeSolo.toFixed(2)}</div>
                    </div>

                    <div class="font-bold ${colorTotal} text-xs">👉 GANANCIA NETA TOTAL: S/. ${signTotal}${netoTotal.toFixed(2)}</div>
                    <div class="text-[11px] text-gray-500">⏳ Fiados por cobrar: S/. ${b.fiado_p.toFixed(2)}</div>
                </div>`;

                wa += `👤 *${nom}*\n`;
                wa += `• Total Yape: S/. ${b.yape.toFixed(2)}\n`;
                wa += `• Total Efectivo: S/. ${b.efectivo.toFixed(2)}\n`;
                wa += `• Gastos: S/. ${b.gastos.toFixed(2)}\n`;
                wa += `👉 *Neto Yape:* S/. ${signYape}${netoYapeSolo.toFixed(2)}\n`;
                wa += `👉 *Ganancia Neta:* S/. ${signTotal}${netoTotal.toFixed(2)}\n\n`;
            });

            textoWhatsAppGlobal = wa;
            document.getElementById('resultado-reporte').innerHTML = html;
        }

        function copiarWhatsApp() {
            if (!textoWhatsAppGlobal) {
                alert('Primero haz clic en Calcular para armar el reporte.');
                return;
            }
            navigator.clipboard.writeText(textoWhatsAppGlobal).then(() => {
                vibrarConfirmacion();
                alert('📋 Resumen copiado al portapapeles. ¡Listo para pegar en WhatsApp!');
            });
        }

        function descargarExcel() {
            const desde = document.getElementById('rep-desde').value;
            const hasta = document.getElementById('rep-hasta').value;
            window.location.href = `/api/exportar_csv?desde=${desde}&hasta=${hasta}&_t=${Date.now()}`;
        }

        function descargarBackup() {
            window.location.href = `/api/backup_json?_t=${Date.now()}`;
        }
    </script>
</body>
</html>
